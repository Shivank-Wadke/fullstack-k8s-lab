services:
  backend:
    build:
      context: ./backend
    image: lab-backend:v1
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://database:27017/labdb
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: lab-frontend:v1
    ports:
      - "3000:80"
    depends_on:
      - backend

  database:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
